# Render Blueprint - deploy server SIKE HUB 1 click
# Render Dashboard -> New -> Blueprint -> chon repo nay
services:
  - type: web
    name: sikehub-keyserver
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: LINK4M_API
        sync: false
      - key: SITE_URL
        sync: false
      - key: KEY_TTL_HOURS
        value: "48"
